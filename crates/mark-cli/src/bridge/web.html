<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mark review</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#111318;color:#e4e6eb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #444a59;border-radius:5px;padding:7px 12px;background:#222733;color:inherit}button:hover{background:#343e50}button.primary{background:#567cda;border-color:#567cda;color:white}button:disabled{opacity:.4;cursor:default}header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #303642;position:sticky;top:0;background:#171a21;z-index:2}header strong{font-size:19px}#scope{flex:1;color:#aab2c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;min-height:calc(100vh - 60px)}nav{padding:12px;border-right:1px solid #303642;overflow:auto;position:sticky;top:60px;height:calc(100vh - 60px)}nav button{text-align:left;display:block;width:100%;margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#diff{min-width:0;padding:12px}section.file{border:1px solid #303642;border-radius:5px;margin-bottom:18px;overflow:hidden;scroll-margin-top:75px}.file h2{font:600 13px system-ui;background:#222733;padding:10px;margin:0;overflow-wrap:anywhere}.line{display:flex;white-space:pre;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-width:max-content}.code{flex:1;padding:0 8px}.gutter{width:45px;flex-shrink:0;text-align:right;padding:0 7px;color:#778299;user-select:none}.add{background:#142b23}.del{background:#321e25}.hunk{background:#20283a;color:#a2b9ee}.line[data-anchor]{cursor:pointer}.line[data-anchor]:hover,.line.selected{outline:1px solid #779cff;outline-offset:-1px}.patch{overflow:auto;padding:5px 0}aside{border-left:1px solid #303642;padding:16px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}textarea{display:block;width:100%;min-height:100px;background:#111318;color:inherit;border:1px solid #444a59;border-radius:5px;padding:9px;resize:vertical}#target{font:12px ui-monospace,monospace;color:#aab2c4;overflow-wrap:anywhere}form button{margin:8px 0}.thread{border-top:1px solid #303642;margin-top:16px;padding-top:12px}.thread p{white-space:pre-wrap;overflow-wrap:anywhere}.thread small{color:#97a3ba}.stale{color:#e8b772}.message{padding:8px 0;border-bottom:1px solid #252b37}.message p{margin:4px 0}#notice{padding:10px 20px;background:#20283a;white-space:pre-wrap}#notice:empty{display:none}.empty{color:#97a3ba;padding:30px;text-align:center}.thread label{display:flex;gap:8px;align-items:center}#cancelReply{font-size:12px;padding:3px 6px}@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr) 310px}nav{display:none}}@media(max-width:650px){main{display:block}aside{position:static;height:auto;border:0;border-top:1px solid #303642}header{flex-wrap:wrap}#scope{flex-basis:60%}}
</style>
<header><strong>mark</strong><span id="scope">Loading review…</span><button id="refresh">Refresh changes</button><button id="back">Back to conversation</button><button class="primary" id="send">Send feedback</button></header>
<div id="notice" role="status"></div><main><nav id="files" aria-label="Changed files"></nav><div id="diff"></div><aside><form id="compose"><h3 id="composeTitle">Add a note</h3><p id="target">Select a file or line in the diff.</p><textarea id="body" aria-label="Review note" placeholder="Ask a question or request a change…"></textarea><button id="save" class="primary" disabled>Save note</button> <button type="button" id="cancelReply" hidden>Cancel reply</button></form><div id="threads"></div></aside></main>
<script>__MARK_SCRIPT__</script></html>
