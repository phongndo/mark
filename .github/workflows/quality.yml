name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      generated: ${{ steps.classify.outputs.generated }}
      performance: ${{ steps.classify.outputs.performance }}
      workflows: ${{ steps.classify.outputs.workflows }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test change classifier
        run: python3 -m unittest tools/test_ci_changes.py

      - name: Classify impacted lanes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/changes.py

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install actionlint
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

  rust:
    name: Rust correctness
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run Rust suite
        run: scripts/ci/rust

  msrv:
    name: MSRV (Rust 1.88)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88"

      - name: Restore MSRV cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  generated:
    name: Vendored theme contracts
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/theme-assets/package-lock.json

      - name: Run vendored theme checks
        run: scripts/ci/generated

  performance:
    name: Deterministic performance smoke
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Run performance smoke suite
        run: scripts/ci/performance smoke

  gate:
    name: CI gate
    needs:
      - changes
      - workflow-lint
      - rust
      - msrv
      - generated
      - performance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every selected lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_SELECTED: ${{ needs.changes.outputs.workflows }}
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          GENERATED_SELECTED: ${{ needs.changes.outputs.generated }}
          GENERATED_RESULT: ${{ needs.generated.result }}
          PERFORMANCE_SELECTED: ${{ needs.changes.outputs.performance }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::change classification ended with $CHANGES_RESULT"
            exit 1
          fi

          failed=0
          for entry in \
            "workflow-lint:$WORKFLOW_SELECTED:$WORKFLOW_RESULT" \
            "rust:$RUST_SELECTED:$RUST_RESULT" \
            "msrv:$RUST_SELECTED:$MSRV_RESULT" \
            "generated:$GENERATED_SELECTED:$GENERATED_RESULT" \
            "performance:$PERFORMANCE_SELECTED:$PERFORMANCE_RESULT"
          do
            name="${entry%%:*}"
            remainder="${entry#*:}"
            selected="${remainder%%:*}"
            result="${remainder#*:}"
            if [[ "$selected" == true && "$result" != success ]]; then
              echo "::error::$name was selected but ended with $result"
              failed=1
            elif [[ "$selected" != true && "$result" != skipped && "$result" != success ]]; then
              echo "::error::$name unexpectedly ended with $result"
              failed=1
            fi
          done
          exit "$failed"
